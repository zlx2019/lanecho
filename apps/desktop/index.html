<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lanecho</title>
    <script>
      (function () {
        var label = null;
        try {
          label = window.__TAURI_INTERNALS__.metadata.currentWindow.label;
        } catch (_) {
        }
        var pref = null;
        try {
          pref = localStorage.getItem("lanecho-theme");
        } catch (_) {
        }
        // Same derivation as useTheme (theme.ts): an explicit preference
        // wins, otherwise the system decides
        var light =
          pref === "light" ||
          (pref !== "dark" && matchMedia("(prefers-color-scheme: light)").matches);
        // The palette must be set before the first style pass: the
        // stylesheet's defaults are the dark palette, so a light-theme
        // document would otherwise paint one dark pass until React applies
        // data-theme — and on a window shown right after load (the about
        // window is created lazily and shown the moment it loads) the body
        // background transition animates that flip in front of the user
        document.documentElement.dataset.theme = light ? "light" : "dark";
        if (label === "panel" || label === "preview") {
          document.documentElement.style.background = "transparent";
          return;
        }
        document.documentElement.style.background = light ? "#eef1fa" : "#101425";
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
