# Product name: window title bar, installer package, and executable filename
productName = "Lanecho"
version = "../package.json"
identifier = "io.github.zlx2019.lanecho"

[build]
beforeDevCommand = "pnpm dev"
devUrl = "http://localhost:1420"
beforeBuildCommand = "pnpm build"
frontendDist = "../dist"

[app]
macOSPrivateApi = true

[app.security]
csp = "default-src 'self'; connect-src 'self' ipc: http://ipc.localhost; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'"

[[app.windows]]
title = "Lanecho"
width = 520
height = 460
minWidth = 420
minHeight = 320
visible = false

[[app.windows]]
label = "panel"
title = "Lanecho History"
width = 380
height = 480
resizable = false
decorations = false
alwaysOnTop = true
visible = false
skipTaskbar = true
visibleOnAllWorkspaces = true
transparent = true
windowEffects = { effects = ["popover"], state = "active", radius = 12.0 }

[[app.windows]]
label = "preview"
title = "Lanecho Preview"
width = 400
height = 440
resizable = false
decorations = false
alwaysOnTop = true
visible = false
skipTaskbar = true
visibleOnAllWorkspaces = true
focusable = false
transparent = true
windowEffects = { effects = ["popover"], state = "active", radius = 12.0 }


[bundle]
active = true
targets = ["app", "dmg", "nsis", "appimage", "deb"]
publisher = "zlx2019"
copyright = "Copyright © 2026 zlx2019"
category = "Utility"
shortDescription = "LAN shared clipboard"
longDescription = "Lanecho is a desktop app for sharing the clipboard over a local area network: with no centralized server, after two-way device pairing, when content is copied on any one device, the other devices follow instantly, with TLS encryption throughout."
icon = [
  "icons/32x32.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.icns",
  "icons/icon.ico",
]

[bundle.macos]
minimumSystemVersion = "10.15"

[bundle.windows.nsis]
installMode = "perMachine"
installerHooks = "windows/hooks.nsh"

[bundle.linux.deb]
