[package]
name = "lanecho-desktop"
description = "Lanecho desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true


[lib]
name = "lanecho_desktop_lib"
crate-type = ["lib"]

[[bin]]
name = "Lanecho"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = ["config-toml"] }

[dependencies]
lanecho-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tauri = { version = "2", features = [
    "config-toml",
    "tray-icon",
    "image-png",
    "macos-private-api",
] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
png = { workspace = true }
fast_image_resize = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.2"

# Auto-paste synthesizes a keystroke through platform APIs (see autopaste.rs);
# both are already workspace dependencies of lanecho-core
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
