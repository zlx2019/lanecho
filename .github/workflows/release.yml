name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Generate Changelog and create GitHub Release
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    # The bundle jobs feed the changelog back to tauri-action: on an existing
    # release it always PATCHes name+body with its own inputs (see
    # create-release.ts "Updating name and body of existing release"), so
    # leaving releaseBody unset had every bundle job wipe the changelog this
    # job just wrote
    outputs:
      content: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag matches app version
        run: |
          ver=$(jq -r '.version' apps/desktop/package.json)
          tag="${{ github.ref_name }}"
          if [ "v$ver" != "${tag%%-*}" ] && [ "v$ver" != "$tag" ]; then
            echo "::error::Tag $tag does not match app version $ver"
            exit 1
          fi

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # --current, not --latest: --latest means "the newest tag in the
          # repository" regardless of the checked-out HEAD, so re-running this
          # job after newer tags exist would write another version's
          # changelog onto this release (it did — v0.1.0 briefly carried
          # v0.1.1's notes). --current resolves the tag HEAD sits on, which
          # is identical on a fresh tag push and stays correct on a re-run.
          args: ${{ contains(github.ref_name, '-') && format('--unreleased --tag {0}', github.ref_name) || '--current' }} --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGES.md
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ contains(github.ref_name, '-') }}

  bundle:
    name: Bundle ${{ matrix.name }}
    needs: changelog
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
            asset_name_pattern: Lanecho-[version]-macos-[arch][setup][ext]
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
            asset_name_pattern: Lanecho-[version]-macos-[arch][setup][ext]
          - name: Linux
            os: ubuntu-22.04
            args: ""
            rust-target: ""
            asset_name_pattern: Lanecho-[version]-linux-[arch][setup][ext]
          - name: Windows
            os: windows-latest
            args: ""
            rust-target: ""
            asset_name_pattern: Lanecho-[version]-windows-[arch][setup][ext]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.rust-target }}
      - name: Enable Apple code signing (optional)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE Not configured, skip signing, produce unsigned package"
            exit 0
          fi
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            {
              echo "${var}<<__APPLE_EOF__"
              printenv "$var"
              echo "__APPLE_EOF__"
            } >> "$GITHUB_ENV"
          done
      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          args: ${{ matrix.args }}
          releaseAssetNamePattern: ${{ matrix.asset_name_pattern }}
          # tauri-action PATCHes name+body onto an existing release whatever
          # happens, so it must be handed the same changelog the release was
          # created with — otherwise each bundle job resets the body to empty.
          # releaseName/prerelease guard the same PATCH (and the create path,
          # reachable when a bundle job is re-run against a deleted release):
          # unset they would blank the title and promote an rc to a full
          # release
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ needs.changelog.outputs.content }}
          prerelease: ${{ contains(github.ref_name, '-') }}

  macos-native:
    name: Bundle macOS (native)
    needs: changelog
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Verify tag matches native app version
        run: |
          ver=$(grep -m1 'MARKETING_VERSION:' apps/macos/project.yml | sed 's/.*"\(.*\)".*/\1/')
          tag="${{ github.ref_name }}"
          if [ "v$ver" != "${tag%%-*}" ] && [ "v$ver" != "$tag" ]; then
            echo "::error::Tag $tag does not match native app version $ver (apps/macos/project.yml)"
            exit 1
          fi
          echo "NATIVE_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build app bundle
        working-directory: apps/macos
        run: ./build-app.sh

      - name: Create disk image
        working-directory: apps/macos
        run: |
          app="build/Build/Products/Release/Lanecho.app"
          test -x "$app/Contents/MacOS/Lanecho"
          # Assert both slices so a single-architecture build is never published
          # as universal and delivered to users with incompatible hardware.
          archs=$(lipo -archs "$app/Contents/MacOS/Lanecho")
          echo "archs: $archs"
          case "$archs" in
            *arm64*) ;;
            *) echo "::error::Missing arm64 slice; binary is not universal"; exit 1 ;;
          esac
          case "$archs" in
            *x86_64*) ;;
            *) echo "::error::Missing x86_64 slice; binary is not universal"; exit 1 ;;
          esac
          staging=$(mktemp -d)
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"
          dmg="Lanecho-${NATIVE_VERSION}-macos-native-universal.dmg"
          hdiutil create -volname "Lanecho" -srcfolder "$staging" \
            -ov -format UDZO "$dmg"
          echo "DMG_PATH=apps/macos/$dmg" >> "$GITHUB_ENV"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.DMG_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}
