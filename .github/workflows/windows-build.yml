name: Windows Installer

# Builds an installable Windows package for pull requests, so a Windows-only
# change can be verified on a real machine before it is merged. Release
# artifacts are not produced here — release.yml owns those (tag driven, with
# the published asset names).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "deps/lanecho-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # The frontend build is wired into beforeBuildCommand (Tauri.toml), so
      # this single command covers tsc + vite + cargo + the NSIS bundler
      - name: Build installer
        working-directory: apps/desktop
        run: pnpm tauri build --bundles nsis

      # Bundles land in the workspace target directory (repository root), not
      # under apps/desktop
      - name: List produced bundles
        shell: pwsh
        run: Get-ChildItem target/release/bundle/nsis

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Lanecho-windows-x64-${{ github.run_number }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
