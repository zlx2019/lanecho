name: Android

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-test:
    name: core (JVM tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Same version as the jvmToolchain(17) declaration so the daemon
          # JVM itself satisfies the toolchain and no probing is involved
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        working-directory: apps/android
        run: ./gradlew build --console=plain
