name: Android

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
      - "deps/lanecho-core/**"
      - "deps/lanecho-cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
      - "deps/lanecho-core/**"
      - "deps/lanecho-cli/**"
      - "Cargo.toml"
      - "Cargo.lock"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-test:
    name: core (JVM tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Same version as the jvmToolchain(17) declaration so the daemon
          # JVM itself satisfies the toolchain and no probing is involved
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build lanecho-cli (interop peer)
        run: cargo build -p lanecho-cli
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Core tests and debug APK
        working-directory: apps/android
        env:
          LANECHO_CLI_BIN: ${{ github.workspace }}/target/debug/lanecho-cli
        run: ./gradlew :core:test :app:assembleDebug --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lanecho-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
